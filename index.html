<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swastik Nayak | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --deep-green: #0f3d2e;
  --light-green: #22c55e;
  --beige: #f5f5dc;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  color: var(--beige);
  overflow-x: hidden;
}

/* BACKGROUND ANIMATION */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, #0f3d2e, #081c15, #0f3d2e);
  animation: moveBg 10s infinite linear;
  z-index: -1;
}

@keyframes moveBg {
  0% { transform: translate(0,0); }
  50% { transform: translate(-20%, -20%); }
  100% { transform: translate(0,0); }
}

/* CURSOR */
.cursor {
  width: 15px;
  height: 15px;
  border: 2px solid var(--light-green);
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  z-index: 9999;
}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  padding: 18px 8%;
  display: flex;
  justify-content: space-between;
  backdrop-filter: blur(10px);
}

nav a {
  margin-left: 20px;
  color: var(--beige);
  text-decoration: none;
}

/* HERO */
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 140px 8%;
}

.hero-text h1 {
  font-size: 44px;
}

.typing {
  color: var(--light-green);
}

/* IMAGE */
.img-box img {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 2px solid var(--light-green);
}

/* SECTION */
section {
  padding: 80px 8%;
  opacity: 0;
  transform: translateY(40px);
  transition: 1s;
}

section.show {
  opacity: 1;
  transform: translateY(0);
}

/* CARD */
.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

/* CONTACT */
.contact a {
  display: block;
  margin-top: 8px;
  color: var(--light-green);
}

/* MOBILE */
@media(max-width:900px){
  .hero {
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>

<body>

<div class="cursor"></div>

<!-- NAV -->
<nav>
  <h2>Swastik</h2>
  <div>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-text">
    <h1>Swastik Nayak</h1>
    <p class="typing"></p>
  </div>

  <div class="img-box">
    <img src="profile.jpg">
  </div>
</div>

<!-- ABOUT -->
<section id="about">
  <h2>About</h2>
  <p>AI/ML student building scalable systems and modern applications.</p>
</section>

<!-- SKILLS -->
<section id="skills">
  <h2>Skills</h2>
  <div class="card">C • Python • JavaScript</div>
  <div class="card">HTML • CSS • React (Learning)</div>
</section>

<!-- PROJECT -->
<section id="projects">
  <h2>Projects</h2>
  <div class="card">Portfolio Website</div>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
  <h2>Contact</h2>
  <a href="mailto:mrswastik372@gmail.com">Email</a>
  <a href="https://swastik51.github.io">GitHub</a>
</section>

<script>
// CURSOR
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e=>{
  cursor.style.top = e.clientY+"px";
  cursor.style.left = e.clientX+"px";
});

// TYPING
const text = "Full Stack Developer | AI & ML Engineer";
let i=0;
function typing(){
  if(i<text.length){
    document.querySelector(".typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typing,50);
  }
}
typing();

// SCROLL
const sections = document.querySelectorAll("section");
window.addEventListener("scroll", ()=>{
  sections.forEach(sec=>{
    const top = sec.getBoundingClientRect().top;
    if(top < window.innerHeight - 100){
      sec.classList.add("show");
    }
  });
});
</script>

</body>
</html>
