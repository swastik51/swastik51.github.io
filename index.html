<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swastik Nayak | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #00f5ff;
  --bg: #020617;
  --text: #fff;
  --sub: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: var(--text);
  overflow-x: hidden;
}

/* CUSTOM CURSOR */
.cursor {
  width: 20px;
  height: 20px;
  border: 2px solid var(--primary);
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  padding: 20px 8%;
  backdrop-filter: blur(10px);
}

/* HERO */
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 120px 8%;
  min-height: 100vh;
}

.hero-text h1 {
  font-size: 55px;
}

.hero span {
  color: var(--primary);
}

/* TYPING */
.typing {
  color: var(--primary);
  font-weight: bold;
}

/* IMAGE */
.hero-img img {
  width: 300px;
  border-radius: 50%;
  box-shadow: 0 0 50px var(--primary);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 20px var(--primary); }
  50% { box-shadow: 0 0 60px var(--primary); }
  100% { box-shadow: 0 0 20px var(--primary); }
}

/* SECTION */
section {
  padding: 80px 8%;
}

/* SKILLS */
.skill-bar {
  margin: 15px 0;
}

.bar {
  height: 10px;
  background: #1e293b;
  border-radius: 10px;
}

.fill {
  height: 10px;
  background: var(--primary);
  width: 0;
  border-radius: 10px;
}

/* CERTIFICATE MODAL */
.modal {
  display: none;
  position: fixed;
  top:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal img {
  width: 80%;
}

/* BUTTON */
.btn {
  margin-top: 20px;
  padding: 12px 20px;
  background: var(--primary);
  border: none;
  cursor: pointer;
}

/* RESPONSIVE */
@media(max-width:900px){
  .hero { flex-direction: column; text-align:center; }
}
</style>
</head>

<body>

<div class="cursor"></div>

<!-- HERO -->
<div class="hero">
  <div class="hero-text">
    <h1>Hi, I'm <span>Swastik Nayak</span></h1>
    <p class="typing"></p>
    <button class="btn" onclick="scrollToSection()">Explore</button>
  </div>

  <div class="hero-img">
    <img src="profile.jpg">
  </div>
</div>

<!-- ABOUT -->
<section id="about">
  <h2>About Me</h2>
  <p>B.Tech CSE AI/ML student building future tech.</p>
</section>

<!-- SKILLS -->
<section>
  <h2>Skills</h2>

  <div class="skill-bar">
    HTML
    <div class="bar"><div class="fill" style="width:90%"></div></div>
  </div>

  <div class="skill-bar">
    JavaScript
    <div class="bar"><div class="fill" style="width:80%"></div></div>
  </div>

</section>

<!-- CERTIFICATE -->
<section>
  <h2>Certification</h2>
  <img src="certificate.jpg" width="300" onclick="openModal()">
</section>

<div class="modal" id="modal">
  <img src="certificate.jpg">
</div>

<script>
// TYPING EFFECT
const text = "Full Stack Developer | AI & ML Enthusiast";
let i=0;
function typing(){
  if(i<text.length){
    document.querySelector(".typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typing,50);
  }
}
typing();

// CURSOR
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e=>{
  cursor.style.top = e.clientY+"px";
  cursor.style.left = e.clientX+"px";
});

// MODAL
function openModal(){
  document.getElementById("modal").style.display="flex";
}
document.getElementById("modal").onclick=()=>{
  document.getElementById("modal").style.display="none";
}

// SCROLL
function scrollToSection(){
  document.getElementById("about").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
